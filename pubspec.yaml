name: aeroassist_ai
description: "Offline AR-Powered Smart Maintenance Assistant for Aircraft Maintenance Engineers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0

  # Local Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0

  # Camera Integration
  camera: ^0.11.0+1
  image_picker: ^1.1.2

  # AI/ML Integration
  tflite_flutter: ^0.11.0
  google_ml_kit: ^0.13.0

  # Speech & Voice
  speech_to_text: ^6.6.0
  flutter_tts: ^4.2.5

  # Storage & Sync
  firebase_core: ^2.24.0
  firebase_database: ^10.3.0
  firebase_storage: ^11.5.0

  # JSON & Serialization
  json_serializable: ^6.7.0
  freezed_annotation: ^2.4.0

  # UI & Navigation
  go_router: ^12.0.0
  flutter_screenutil: ^5.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  http: ^1.1.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  freezed: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/manuals/
    - assets/voice/
    - assets/images/
    - assets/data/maintenance_procedures.json
    - assets/data/torque_specs.json
